# tool 사용 안내 — 이번 턴에 켜진 tool 의 안내만 시스템 프롬프트에 붙는다 (agent.build_prompt).
#
# MCP tool 의 docstring 은 "무엇을 · 언제" (tool 선택 기준) 이고,
# 여기는 허브 화면과의 약속 — 카드 태그 형식, 결과를 어떻게 정리 · 제안할지 — 를 적는다.
# 안내가 필요 없는 tool 은 적지 않는다.
#
# 카드 태그는 프론트(components/cards/index.tsx)가 찾아서 카드로 그린다. 형식을 바꾸면 프론트도 같이 바꿔야 한다.

search_notices: |
  카드 태그: [NOTICE_LIST:{keyword}]   예) [NOTICE_LIST:보안]
  - 검색 결과를 2~3줄로 요약한 뒤 태그를 넣으면 화면에 목록 카드가 그려진다

get_metric_trend: |
  결과의 chart 값([CHART:...])을 그대로 답변에 넣으면 확대 · 축소되는 차트 카드가 그려진다 — 기본은 이것을 쓴다.
  - 답변: 설비별 평균 · OOC 건수를 짧은 표로, 이탈이 있으면 최근 이탈 시각을 함께
  - 사용자가 이동평균 · 설비 간 차이 · 분포 · 다른 축 조합 등 기본 차트에 없는 형태를 원하면
    run_python 에서 df = load_ref("<data_ref 값>") 로 같은 데이터를 받아 직접 그린다

get_insp_map: |
  결과의 chart 값([WAFER_MAP:...])을 그대로 답변에 넣으면 Lot 전체 웨이퍼 맵 카드가 그려진다
  (작은 맵 격자 · 클릭 확대 · defect 유형별 켜고 끄기 · 마우스를 올리면 좌표 · 크기).
  - 숫자는 결과 값 그대로 쓴다. pattern 은 INSP 자동 분류 결과이므로 '자동 분류' 라고 밝힌다
  - 맵 좌표로 추가 분석(반경별 분포, 웨이퍼 간 위치 겹침 등)이 필요하면
    run_python 에서 load_ref("ui_insp_map?lot_id=<LOT>") — 이 데이터는 차트 형식이 아니라 dict 로 온다
    (wafers[i].defects = [x_mm, y_mm, class index, size_um], classes = 유형 이름)

run_python: |
  호출할 때마다 같은 대화의 Python 세션이 이어진다 (변수 · import 유지).
  - 데이터: load_ref("<다른 tool 결과의 data_ref>") → pandas DataFrame (x, series, value 열). 값을 코드에 직접 옮겨 적지 않는다
  - 차트: plotly 로 그리고 save_html(fig, "제목") — 결과의 [ARTIFACT:...] 태그를 답변에 그대로 넣으면 화면에 대화형 차트가 보인다
  - matplotlib 이미지도 자동으로 [ARTIFACT:...] 가 생긴다. 대화형이 필요하면 plotly 를 쓴다
  - 오류가 나면 traceback 을 보고 고쳐서 다시 실행한다
